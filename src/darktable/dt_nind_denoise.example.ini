[command]
# path to darktable-cli
darktable = /opt/darktable/bin/darktable-cli

# for Windows: darktable = "C:/Program Files/darktable/bin/darktable-cli.exe"

#path to gmic
gmic = /usr/bin/gmic

# command to invoke nind-denoise
nind_denoise = export 'PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512'; /home/noname/python_envs/nind_denoise/bin/python3 /home/noname/nind-denoise/src/nind_denoise/denoise_image.py

# path and network type of the model
nind_denoise_params = --network UtNet --model_path "/home/noname/nind-denoise/models/generator_650.pt"


[grain]
# Optional: Path to .dtstyle template to extract natural grain.
# If commented out or missing, natural grain blending is completely skipped.
style = grain_profile.dtstyle

# Minimum noise standard deviation to trigger blending
noise_thresh = 500.0

# Base alpha for grain blending.
# You can use a fixed number:
#   alpha = 0.20
# Or a dynamic formula using the 'noise' variable:
#   alpha = 0.20 * (noise / 150)
# You can also cap it using min/max so it doesn't get out of hand on ISO 12800 shots:
#   alpha = min(0.60, 0.20 * (noise / 150))
alpha = min(0.50, 0.3 * ((noise - 300)/ 3000))