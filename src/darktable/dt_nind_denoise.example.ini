[command]
# path to darktable-cli
darktable = /opt/darktable/bin/darktable-cli

# for Windows: darktable = "C:/Program Files/darktable/bin/darktable-cli.exe"

#path to gmic
gmic = /usr/bin/gmic

# command to invoke nind-denoise
nind_denoise = export 'PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512'; /home/noname/python_envs/nind_denoise/bin/python3 /home/noname/nind-denoise/src/nind_denoise/denoise_image.py

# path and network type of the model
nind_denoise_params = --network UtNet --model_path "/home/noname/nind-denoise/models/generator_650.pt"


[grain]
# Optional: Path to .dtstyle template to extract natural grain.
# If commented out or missing, natural grain blending is completely skipped.
style = /home/noname/bin/grain_profile.dtstyle

# Minimum noise standard deviation to trigger blending
noise_thresh = 500.0

# ==== Dynamic Luma Masking (If this section is missing, grain is applied globally) =====
# shadow_floor: Minimum grain that will EVER be applied to absolute pitch black (0.0 to 1.0).
#   A floor of 0.25 ensures shadows always retain 25% of the dynamic alpha.
shadow_floor = 0.25

# luma_pivot: The exponent that controls how quickly separation increases with noise.
#   0.00: Perfect linear separation (gamma always = 1.0, like shadow_protect=1).
#   0.20: Conservative separation (gamma ramps up slowly).
#   0.30: Moderate separation (good film emulation fallback).
#   0.45: Aggressive separation (ramps gamma quickly for dramatic high ISO contrast).
luma_pivot = 0.30

# luma_max_sep: The maximum possible gamma separation curve (e.g., a cap of 2.0).
luma_max_sep = 2.0


# ==== Base alpha for grain blending. ====
# You can use a fixed number:
#   alpha = 0.20
# Or a dynamic formula using the 'noise' variable:
#   alpha = 0.20 * (noise / 150)
# alpha = min(0.50, 0.25 * ((noise)/ 3000))

# S-CURVE approximation
# Squares the noise ratio to keep low noise very low, but wraps it in a log to plateau the high end.
alpha = 0.65 * log10(1 + (noise / 150)**2)

# LOGARITHMIC CURVE
# Uses log base e (natural log). We add +1 so log(1) = 0 if noise is 0.
# Noise 150 -> log(2) * 0.3 = 0.20 alpha
# Noise 600 -> log(5) * 0.3 = 0.48 alpha
# Noise 1500 -> log(11) * 0.3 = 0.71 alpha
# alpha = 0.30 * log(1 + (noise / 150))

# POWER CURVE (Gamma = 1.5)
# Moderate noise (e.g. 200) = (200/150)^1.5 * 0.15 = 0.23 alpha
# Extreme noise (e.g. 600) = (600/150)^1.5 * 0.15 = 1.20 alpha -> capped to 0.8 by max()
# alpha = min(0.80, 0.15 * (noise / 150)**1.5)
